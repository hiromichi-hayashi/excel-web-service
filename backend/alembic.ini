# Alembic設定ファイル

[alembic]
# マイグレーションスクリプトの場所
script_location = alembic

# テンプレートファイルの場所
file_template = %%(rev)s_%%(slug)s

# タイムゾーン設定
timezone = Asia/Tokyo

# データベース接続URL
# 環境変数 DATABASE_URL から読み込まれる（env.py で設定）
# sqlalchemy.url = driver://user:pass@localhost/dbname

# ロギング設定
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
