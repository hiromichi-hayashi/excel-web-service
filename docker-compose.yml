version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: excel-app
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/.venv
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-excel_web_service}
    depends_on:
      - db
    command: tail -f /dev/null

  db:
    image: postgres:16
    container_name: ${DB_CONTAINER_NAME:-excel-db}
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-excel_web_service}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
