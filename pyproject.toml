[project]
name = "excel-web-service"
version = "1.0.0"
description = "FastAPIを使用したExcel処理Webサービス"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "psycopg2-binary>=2.9.9",
    "sqlmodel>=0.0.16",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0.0",
    "alembic>=1.13.0",
    "pydantic[email]>=2.0.0",
    "openpyxl>=3.1.2",
    "pandas>=2.2.0",
    "aiofiles>=23.2.1",
    "chardet>=5.2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
# 行の長さ
line-length = 100

# Python 3.14をターゲット
target-version = "py314"

# 除外するディレクトリ
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    "*.egg-info",
    "uploads",
]

[tool.ruff.lint]
# 有効にするルール
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]

# 無視するルール
ignore = [
    "E501",  # 行が長すぎる（Ruffのフォーマッターが処理）
    "B008",  # 関数呼び出しの引数でのデフォルト値（FastAPIのDependsで必要）
]

# ファイルごとの無視設定
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # 未使用のimport（__init__.pyでは一般的）

[tool.ruff.format]
# シングルクォートを使用
quote-style = "double"

# インデント
indent-style = "space"

# 行末
line-ending = "lf"
